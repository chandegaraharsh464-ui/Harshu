<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Label by You – Indo-Western Fashion</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF7F2;--bar:#F3EFEA;--ink:#4A3F35;--brand:#5C4D43;--mute:#8C7A6B;--card:#fff;--line:#e6dfd6}
@media (prefers-color-scheme:dark){:root{--bg:#1d1916;--bar:#26211d;--ink:#eadfd2;--brand:#d9c3a8;--mute:#a8957f;--card:#2a2420;--line:#3d352e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Jost,system-ui,sans-serif}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
a{color:var(--brand)}
.btn{background:var(--brand);color:var(--bg);border:0;padding:.6rem 1.1rem;border-radius:8px;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.btn.pill{border-radius:999px}
.btn.sm{padding:.3rem .8rem;font-size:.85rem}
nav.top{display:flex;flex-wrap:wrap;gap:.75rem 1.5rem;justify-content:space-between;align-items:center;padding:1rem 1.5rem;background:var(--bar)}
nav.top .links{display:flex;flex-wrap:wrap;gap:1rem;align-items:center}
nav.top .links>button.l{background:none;border:0;color:var(--ink);padding:.25rem}
.logo{font-size:1.7rem;letter-spacing:.18em;color:var(--brand);font-weight:700}
.wrap{max-width:1150px;margin:0 auto;padding:2rem 1.25rem 4rem}
.hero{text-align:center;margin-bottom:2.5rem}
.hero h2{font-size:clamp(2.2rem,6vw,3.4rem);color:var(--brand);margin-bottom:.6rem}
.hero p{color:var(--mute);max-width:36rem;margin:0 auto;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:1.5rem}
.card{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.card .ph{aspect-ratio:3/4;overflow:hidden;background:var(--bar)}
.card img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card:hover img{transform:scale(1.04)}
.card .b{padding:1rem 1.1rem 1.2rem}
.card h3{font-size:1.25rem;line-height:1.2;margin-bottom:.3rem}
.card .pr{color:var(--mute);margin:0 0 .9rem}
.row{display:flex;gap:.5rem}.row .btn:first-child{flex:1}
.contact{max-width:34rem;margin:0 auto;background:var(--card);padding:2.5rem 1.5rem;border-radius:16px;border:1px solid var(--line);text-align:center}
.contact h2{font-size:2.2rem;color:var(--brand);margin-bottom:1.5rem}
.contact p{margin:.9rem 0;font-size:1.05rem;word-break:break-word}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:50;overflow-y:auto}
.modal{background:var(--card);border-radius:14px;padding:1.5rem;width:100%;max-width:400px;border:1px solid var(--line)}
.modal h3{font-size:1.6rem;margin-bottom:.6rem;color:var(--brand)}
label.f{display:block;font-size:.85rem;color:var(--mute);margin:.7rem 0 .25rem}
input[type=text],input[type=password],input[type=tel],input[type=email],textarea{width:100%;padding:.6rem .75rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.acts{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1.2rem}
.err{color:#c0392b;font-size:.85rem;margin-top:.5rem;min-height:1em}
.toast{position:fixed;left:50%;bottom:1.25rem;transform:translateX(-50%);background:var(--brand);color:var(--bg);padding:.7rem 1.2rem;border-radius:999px;z-index:60;max-width:90vw}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;text-align:center;padding:1.2rem;border:2px dashed var(--mute);border-radius:10px;cursor:pointer;color:var(--mute);min-height:100px}
.drop.over{background:var(--bar);border-color:var(--brand)}
.drop img{max-height:150px;border-radius:8px}
.admin{min-height:100vh;display:flex;flex-wrap:wrap}
.side{width:240px;padding:1.5rem;display:flex;flex-direction:column;gap:.6rem;border-right:1px solid var(--line);background:var(--card)}
.side h2{font-size:1.6rem;color:var(--brand);margin-bottom:.6rem}
.side button.t{text-align:left;padding:.55rem .9rem;border-radius:8px;border:0;background:none;color:inherit;display:flex;justify-content:space-between;align-items:center}
.side button.t.on{background:var(--bar);color:var(--brand);font-weight:500}
.badge{background:#d33;color:#fff;font-size:.72rem;padding:.1rem .5rem;border-radius:999px}
.main{flex:1;min-width:0;padding:1.5rem}
.main h2{font-size:2.2rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem;overflow-x:auto;margin-top:1rem}
.item{display:flex;flex-wrap:wrap;gap:.75rem;justify-content:space-between;align-items:center}
.item.new{border-left:4px solid #d33}
table{width:100%;border-collapse:collapse;text-align:left;min-width:480px}
th{color:var(--mute);font-weight:400;padding:.5rem}td{padding:.6rem .5rem;border-top:1px solid var(--line)}
td img{width:48px;height:48px;object-fit:cover;border-radius:6px;display:block}
.lnk{background:none;border:0;color:#3b82f6;padding:0 .8rem 0 0}.lnk.d{color:#d33}
.form{max-width:30rem}
small.m{color:var(--mute)}
@media(max-width:700px){.side{width:100%;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}.side h2{width:100%}}

/* LABEL BY YOU — premium portfolio upgrade */
:root{--bg:#f6f0e6;--bar:#fbf7ef;--ink:#211d19;--brand:#9a7539;--mute:#746b60;--card:#fffdf9;--line:#dfd2bf;--gold:#b89252}
body{font-family:Jost,Arial,sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;letter-spacing:-.025em}
nav.top{position:sticky;top:0;z-index:20;padding:1rem clamp(1rem,5vw,5rem);background:rgba(251,247,239,.9);backdrop-filter:blur(16px);border-bottom:1px solid #b8925233;box-shadow:0 5px 25px #201b1407}
.logo{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.8rem;letter-spacing:.18em;color:#211d19}
nav.top .links{gap:1rem}nav.top .links>button.l{font-size:.82rem;transition:color .25s}nav.top .links>button.l:hover{color:var(--gold)}
.btn{background:#211d19;color:#f6f0e6;border-radius:2px;padding:.78rem 1.25rem;letter-spacing:.04em;transition:transform .25s,background .25s,border-color .25s}.btn:hover{transform:translateY(-2px);background:#9a7539}.btn.ghost{background:transparent;color:#211d19;border-color:#b89252}.btn.ghost:hover{color:white}
.wrap{max-width:1240px;padding:0 clamp(1rem,5vw,5rem) 5rem}
.lby-hero{min-height:72vh;display:grid;grid-template-columns:1fr .9fr;align-items:center;gap:clamp(2rem,7vw,7rem);padding:clamp(3rem,7vw,7rem) 0 4rem;position:relative;overflow:hidden}
.lby-kicker{font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:#9a7539;display:flex;align-items:center;gap:.7rem}.lby-kicker:before{content:'';height:1px;width:32px;background:#b89252}
.lby-hero h1{font-size:clamp(3.2rem,7vw,7rem);line-height:.98;margin:1.3rem 0 1.5rem;max-width:750px}.lby-hero h1 em{color:#a27d42;font-weight:500}.lby-hero p{max-width:440px;line-height:1.8;color:var(--mute)}.lby-hero-actions{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;margin-top:1.7rem}
.lby-hero-art{height:min(68vh,680px);min-height:390px;position:relative;background:#e1d3c0;overflow:hidden;border-radius:48% 48% 2px 2px / 30% 30% 2px 2px;box-shadow:18px 18px 0 #b892521c}.lby-hero-art img{width:100%;height:100%;object-fit:cover;animation:lbyImageIn 1.2s cubic-bezier(.2,.7,.2,1) both}.lby-art-label{position:absolute;right:1rem;bottom:1rem;background:#fbf7efee;padding:.8rem 1rem;font-size:.62rem;letter-spacing:.16em;color:#211d19}
.lby-about{padding:5rem 0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:clamp(2rem,7vw,7rem);align-items:center}.lby-about h2,.lby-section-head h2{font-size:clamp(2.5rem,5vw,5rem);line-height:1.02}.lby-about h2 em,.lby-section-head h2 em{color:#a27d42}.lby-about p{color:var(--mute);line-height:1.9}.lby-values{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:1.5rem}.lby-value{border-top:1px solid var(--line);padding-top:1rem}.lby-value b{font-family:'Cormorant Garamond',serif;font-size:1.35rem;font-weight:500}.lby-value span{display:block;color:var(--mute);font-size:.78rem;margin-top:.3rem}
.lby-section-head{display:flex;justify-content:space-between;align-items:end;gap:2rem;margin:2rem 0}.lby-section-head p{color:var(--mute);max-width:360px;line-height:1.8}.hero{margin:0 0 2rem;text-align:left}.hero h2{font-size:clamp(2.6rem,5vw,4.5rem);color:#211d19}.hero p{margin:0;color:var(--mute);max-width:600px}.grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,245px),1fr));gap:1.5rem}.card{border-radius:2px;border:1px solid var(--line);box-shadow:0 10px 30px #211d1908;transition:transform .35s,box-shadow .35s}.card:hover{transform:translateY(-6px);box-shadow:0 18px 45px #211d1916}.card .ph{aspect-ratio:3/4}.card img{transition:transform .8s cubic-bezier(.2,.7,.2,1)}.card:hover img{transform:scale(1.06)}.card .b{padding:1.1rem}.card h3{font-size:1.55rem}.card .pr{font-size:.85rem}.lby-process{margin:5rem 0;padding:3rem 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.lby-process h2{font-size:clamp(2.5rem,5vw,4.5rem);margin-bottom:2rem}.lby-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}.lby-step{border-top:1px solid #b89252;padding:1rem .5rem 0 0}.lby-step small{color:#9a7539;letter-spacing:.15em}.lby-step h3{font-size:1.5rem;margin:.6rem 0}.lby-step p{font-size:.84rem;color:var(--mute);line-height:1.7}.contact{border-radius:2px;max-width:unset;padding:clamp(2rem,5vw,4rem);text-align:left;background:#211d19;color:#f6f0e6;border:0}.contact h2{color:#e0c28a;font-size:clamp(2.5rem,5vw,4rem)}.contact p{color:#d5cabe}.contact a{color:#e0c28a}.contact .btn{background:#b89252;color:#211d19}.lby-footer{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding:2rem 0 0;color:var(--mute);font-size:.72rem;letter-spacing:.08em}
.js .lby-reveal{opacity:0;transform:translateY(24px);transition:opacity .8s,transform .8s}.js .lby-reveal.lby-show{opacity:1;transform:none}
@keyframes lbyImageIn{from{opacity:.3;transform:scale(1.07)}to{opacity:1;transform:scale(1)}}
@media(max-width:760px){nav.top{align-items:flex-start;gap:.8rem;padding:1rem}.logo{font-size:1.3rem}nav.top .links{justify-content:flex-end;gap:.35rem .7rem}nav.top .links>button.l{font-size:.75rem}.lby-hero{grid-template-columns:1fr;min-height:0;padding:3.5rem 0 2.5rem;gap:2rem}.lby-hero h1{font-size:clamp(3.1rem,13vw,5rem)}.lby-hero-art{height:110vw;max-height:540px;min-height:320px;width:90%;margin:0 auto}.lby-about{grid-template-columns:1fr;padding:3.5rem 0;gap:1rem}.lby-values{gap:.7rem}.lby-value b{font-size:1.1rem}.lby-section-head{display:block}.lby-section-head p{margin-top:1rem}.lby-steps{grid-template-columns:repeat(2,1fr);row-gap:1.5rem}.lby-process{margin:3.5rem 0;padding:2.5rem 0}.contact{padding:2rem 1.3rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}.js .lby-reveal{opacity:1;transform:none}}

.btn.like{padding:.6rem .85rem;font-size:1.1rem;line-height:1}.btn.like.on{background:#c0392b;border-color:#c0392b;color:#fff}
.lby-stat{display:flex;gap:1rem;justify-content:space-between;align-items:center;padding:.8rem clamp(1rem,5vw,5rem);background:#e6f4ea;color:#17623a}.lby-stat.cancelled{background:#fdecea;color:#8a1f17}
.lby-custom{text-align:center;padding:4rem 1rem;max-width:42rem;margin:0 auto}.lby-custom p{color:var(--mute);line-height:1.7;margin:1rem 0 1.5rem}
</style>

 if(m==='chat')return bg(`<h3>Chat about: ${esc(o.title)}</h3><label class="f" for="cmsg">Your message to the designer</label><textarea id="cmsg" rows="4"></textarea><div class="err"></div><div class="acts">${cancel}<button class="btn" onclick="sendChat()">Send message</button></div>`);
 if(m==='form'){const e=S.editId?S.outfits.find(x=>x.id===S.editId):null;
  return bg(`<h3>${e?'Edit outfit':'Add outfit'}</h3><label class="f" for="nt">Outfit name</label><input type="text" id="nt" value="${esc(e&&e.title)}"><label class="f" for="np">Price (e.g. ₹15,000)</label><input type="text" id="np" value="${esc(e&&e.price)}"><label class="f">Photo</label><label class="drop" id="drop" for="nf"><img id="pv" alt="Preview"${e?` src="${e.image}"`:' style="display:none"'}><span id="dt">${e?'Click to change photo':'Click here to choose a photo, or drag one in. You can also paste with Ctrl+V.'}</span></label><input type="file" id="nf" accept="image/*" style="margin-top:.6rem;font-size:.85rem;max-width:100%"><div class="err"></div><div class="acts">${cancel}<button class="btn" onclick="saveOutfit()">${e?'Save changes':'Add outfit'}</button></div>`)}
 if(m==='custom'){const u=S.user||{name:'',phone:''};return bg(`<h3>Custom design request</h3><label class="f" for="cn">Your name</label><input type="text" id="cn" value="${esc(u.name)}"><label class="f" for="cp">Phone number</label><input type="tel" id="cp" value="${esc(u.phone)}"><label class="f" for="ct">Describe the outfit you want</label><textarea id="ct" rows="4" placeholder="Colour, style, fabric, occasion..."></textarea><label class="f" for="cb">Budget, size or date needed (optional)</label><input type="text" id="cb"><label class="f">Reference photo (optional)</label><label class="drop" id="drop" for="nf"><img id="pv" alt="Preview" style="display:none"><span id="dt">Click to choose a photo, or paste it with Ctrl+V.</span></label><input type="file" id="nf" accept="image/*" style="margin-top:.6rem;font-size:.85rem;max-width:100%"><div class="err"></div><div class="acts">${cancel}<button class="btn" onclick="sendCustom()">Send request</button></div>`)}
 if(m==='reply')return bg(`<h3>Reply to customer</h3><p style="color:var(--mute);margin:0">The customer sees this on the website, and WhatsApp opens so you can send it there too.</p><label class="f" for="rt">Your reply (ideas, price, time, questions)</label><textarea id="rt" rows="4"></textarea><div class="err"></div><div class="acts">${cancel}<button class="btn" onclick="sendReply()">Send reply</button></div>`);
 if(m==='cancelo')return bg(`<h3>Cancel this order?</h3><p>The customer will be told it was cancelled.</p><div class="acts"><button class="btn ghost" onclick="M(null)">Keep order</button><button class="btn" style="background:#c0392b;color:#fff" onclick="setStatus(S.cid,'cancelled',true)">Cancel order</button></div>`);
 if(m==='del')return bg(`<h3>Delete this outfit?</h3><p>It will be removed from the website.</p><div class="acts">${cancel}<button class="btn" style="background:#c0392b;color:#fff" onclick="delOutfit()">Delete</button></div>`);
 return ''}

function render(){const a=document.activeElement;if(!S.force&&a&&['INPUT','TEXTAREA'].includes(a.tagName)&&a.closest('#page'))return;
 $('#page').innerHTML=S.view==='admin'&&S.admin?adminV():customer();
 const n=S.admin?newOrders()+newMsgs():0;document.title=(n?'('+n+') ':'')+'Label by You – Indo-Western Fashion'}
function R(){S.force=true;render();S.force=false}
function renderModal(){$('#modal').innerHTML=modalV()}
R();

// Motion enhancement: reveal page sections smoothly and respect reduced-motion settings.
function lbyObserve(){
 if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){document.querySelectorAll('.lby-reveal').forEach(el=>el.classList.add('lby-show'));return;}
 if(!('IntersectionObserver' in window)){document.querySelectorAll('.lby-reveal').forEach(el=>el.classList.add('lby-show'));return;}
 const io=new IntersectionObserver((entries,obs)=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('lby-show');obs.unobserve(entry.target)}}),{threshold:.12});
 document.querySelectorAll('#page .lby-reveal').forEach((el,i)=>{el.style.transitionDelay=(i%4)*70+'ms';io.observe(el)});
}
const lbyOldRender=render;
render=function(){lbyOldRender();if(S.view!=='admin' || !S.admin)lbyObserve();};
lbyObserve();

</script>
